<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Owned Cars — Hot Wheels Garage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="menu-bar"></nav>

  <div class="container">
    <div class="page-header">
      <div>
        <h1>My Owned Garage</h1>
        <p class="page-subtitle" id="ownedCount">Loading your collection...</p>
      </div>
    </div>

    <div class="search-controls-row">
      <div class="search-wrapper">
        <input type="text" id="searchBar" class="search-bar" placeholder="Filter owned cars by name, series, HW#, or color...">
        <span id="clearSearch" class="clear-btn">&times;</span>
      </div>

      <div style="display:flex; align-items:center; gap:8px;">
        <label for="groupSelect" style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">Group By:</label>
        <select id="groupSelect" class="select-btn">
          <option value="year_sort">By Year</option>
          <option value="case">Case</option>
          <option value="series">Series</option>
          <option value="alphabetic">Alphabetical (Name)</option>
          <option value="no_filter">All Cars (Newest First)</option>
        </select>
      </div>
    </div>

    <div id="ownedCarsContainer" class="groups-stack"></div>

    <div id="popup" class="popup">
      <div class="popup-content">
        <span id="popupClose" class="popup-close">&times;</span>
        <div id="details"></div>
      </div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="nav.js"></script>
  <script src="popup.js"></script>
  <script src="owned.js"></script>
</body>
</html>
